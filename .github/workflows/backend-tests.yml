name: Backend tests

on:
  pull_request:
    paths:
      - 'src/backend/**'
      - '.github/workflows/backend-tests.yml'
  push:
    branches: [main, dev, feature/backend-foundation]
    paths:
      - 'src/backend/**'
      - '.github/workflows/backend-tests.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fpga_test
          POSTGRES_USER: fpga_test
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fpga_test -d fpga_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://fpga_test:ci_test_password@127.0.0.1:5432/fpga_test
      TEST_DATABASE_URL: postgresql+psycopg://fpga_test:ci_test_password@127.0.0.1:5432/fpga_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install backend dependencies
        run: python -m pip install -e '.[dev]'
      - name: Check code
        run: ruff check .
      - name: Run HTTP and PostgreSQL tests
        run: pytest -ra
