name: FPGA host scaffold

on: [push, pull_request]

permissions:
  contents: read

jobs:
  host-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/fpga
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install host check tools
        run: sudo apt-get update && sudo apt-get install -y build-essential jq shellcheck iverilog
      - run: make all
      - run: make test
      - run: make lint
      - run: make test-hdl
